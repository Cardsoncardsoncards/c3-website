name: Syntax Check

# Fast guard against syntax errors in serverless functions and sync scripts
# before they reach Netlify. Runs `node --check` on every .mjs file.

on:
  push:
    paths:
      - 'netlify/functions/**/*.mjs'
      - 'scripts/**/*.mjs'
      - '.github/workflows/syntax-check.yml'
  pull_request:
    paths:
      - 'netlify/functions/**/*.mjs'
      - 'scripts/**/*.mjs'
  workflow_dispatch:

jobs:
  syntax-check:
    name: node --check all .mjs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check every .mjs file
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! node --check "$f"; then
              echo "::error file=$f::Syntax error in $f"
              fail=1
            fi
          done < <(find netlify/functions scripts -type f -name '*.mjs' | sort)
          echo "Checked $count .mjs file(s)."
          if [ "$fail" -ne 0 ]; then
            echo "::error::Syntax check failed, see annotations above."
            exit 1
          fi
          echo "All .mjs files passed syntax check."

      # The slug rule used to be inline in 31 sync functions and is now one shared module,
      # so a mistake in it breaks every game at once instead of one. This runs the real
      # module against real stored rows, including the five cases where the previous rule
      # would have moved a live URL. See C3L-55.
      - name: Slug assignment regression test
        run: node scripts/test-slug-assign.mjs

      # The Stripe webhook is the only code path between a customer paying and being given
      # what they paid for, so it gets a real test rather than a code read. Everything is
      # stubbed, no live key and no payment infrastructure is touched. Run against the
      # pre-fix handler this suite failed 6 times, including a duplicate delivery granting
      # access twice and a failed grant answering Stripe with 200. See C3L-58 and C3L-59.
      - name: Stripe webhook regression test
        run: node scripts/test-stripe-webhook.mjs

      # The signup defences added for C3L-90, after 181 accounts were created and exactly one
      # of them ever followed a card. Runs the REAL handler with Netlify.env and fetch stubbed,
      # so no email is sent and no database is touched. Asserts the four things that matter and
      # are easy to break silently: a real signup still works, the honeypot rejects without
      # telling the bot, the per-IP limit fires, and email_log gains a row on send. It also
      # guards C3L-44, checking that a registered and an unregistered address still produce
      # identical responses, since suppressing one send and not the other would reopen the
      # enumeration channel that finding closed.
      - name: Signup abuse defences regression test
        run: node scripts/test-signup-defences.mjs
