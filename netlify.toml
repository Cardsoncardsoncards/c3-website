  status = 301
  force = true

# ── Legacy pNNN blog URLs (Google-cached) -> current slug-only URLs ──
# These three now carry the trailing slash, matching the task-159 block below. Without it
# Netlify answered the target with its own 301 to the slashed form, so a visitor took two hops.
# Verified live before the change: each unslashed target 301d to its own slashed form.
# The pNNN number in each "from" is the legacy URL and does NOT match the current source file
# (p312 is really p287-warhammer-tcg-beginners-guide-australia.md, p150 is really
# p227-riftbound-rq-sydney-2026-guide.md). The numbers were left as found: they are the URLs
# Google still holds, so changing them would break the very inbound links these exist to catch.
# Each target was checked against the real filename in src/blog/ rather than assumed.
[[redirects]]
  from = "/blog/p273-digimon-card-game-australia-beginners-guide"
  to = "/blog/digimon-card-game-australia-beginners-guide/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/p312-warhammer-tcg-beginners-guide-australia"
  to = "/blog/warhammer-tcg-beginners-guide-australia/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/p150-riftbound-rq-sydney-2026-guide"
  to = "/blog/riftbound-rq-sydney-2026-guide/"
  status = 301
  force = true

# A "/blog/p248b-rq-sydney-card-spikes" -> "/blog" force redirect used to sit here. Removed as a
# task-159 follow-up. Do NOT re-add it: p248b-rq-sydney-card-spikes.md is a LIVE post. It builds
# to /blog/p248b-rq-sydney-card-spikes/ and is listed in sitemap-blog.xml, but force = true makes
# a redirect win over an existing built page, so the post was unreachable and Google was being
# handed a sitemap URL that 301d straight to the blog index.
# It keeps its pNNN prefix because the permalink rule in .eleventy.js strips /^p\d+-/, and the
# "b" in "p248b-" stops that pattern matching. It is the only one of 591 files in src/blog/ that
# does not match, so nothing else is affected.
# With no rule here the unslashed form gets Netlify's own single 301 to the slashed form, exactly
# like every other post.

# task-159: four more legacy pNNN URLs, found by the task-157 crawler. Unlike the ones above,
# these are not only Google-cached: each is still linked from a LIVE post, so every visitor
# following that link was hitting a 404. All four posts exist and are published, the URLs are
# simply the pre-permalink form (Eleventy strips the pNNN- prefix via eleventyComputed).
#   p249 <- linked from /blog/riftbound-box-opening/
#   p250 <- linked from /blog/lorcana-wilds-unknown-box-opening/
#   p251 <- linked from /blog/riftbound-unleashed-australia/
#   p252 <- linked from /blog/lorcana-wilds-unknown-review/
# Note p251: the legacy URL says "riftbound-unleashed-box-opening" but the post it refers to is
# p251-riftbound-box-opening.md, which publishes at /blog/riftbound-box-opening/. The legacy URL
# carries an "unleashed-" segment the filename never had, so this one is not a pure prefix strip.
#
# These targets keep the trailing slash. The three post redirects above now do too, having been
# brought onto this same single-hop pattern. Without it
# Netlify answers the target with its own 301 to the slashed form, so a visitor took two hops.
# Verified live: /blog/riftbound-unleashed-australia 301s to /blog/riftbound-unleashed-australia/.
# One hop is better for crawlers and for the reader, and nothing else about the pattern changes.
[[redirects]]
  from = "/blog/p249-riftbound-unleashed-australia"
  to = "/blog/riftbound-unleashed-australia/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/p250-lorcana-wilds-unknown-review"
  to = "/blog/lorcana-wilds-unknown-review/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/p251-riftbound-unleashed-box-opening"
  to = "/blog/riftbound-box-opening/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/p252-lorcana-wilds-unknown-box-opening"
  to = "/blog/lorcana-wilds-unknown-box-opening/"
  status = 301
  force = true

