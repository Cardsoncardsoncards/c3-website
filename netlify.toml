# ── C3-076/077 BATCH 1: legacy .html forms 301 to the canonical clean URL ──
#
# Re-derived live on 10 August 2026 rather than taken from the finding: **18** static routes
# serve 200 at BOTH /x and /x.html, not the 20 previously recorded, plus /index.html which
# duplicates /. Full list: calendar, cards, contact, content-engine, dnd, ev-calculator,
# generators, legal, methodology, mtg-strixhaven, play, pricing, quizzes, shop, tools, tracker,
# vip, welcome.
#
# `force = true` is REQUIRED on every one of these and is not decoration. /calendar.html is a
# real file that Eleventy publishes, and Netlify serves an existing file in preference to a
# redirect rule unless the rule is forced. Without it the rule silently does nothing and the
# duplicate keeps serving 200, which is the failure mode this whole batch exists to remove.
#
# No loop is possible for these four: /calendar has no rule pointing at /calendar.html. Netlify
# resolves /calendar to the file calendar.html by its own pretty-URL handling, which is file
# serving and not a redirect, so it never re-enters this table. That is NOT true of /tracker,
# /contact, /methodology and /welcome, which have explicit status = 200 rewrites above and are
# deliberately handled separately.
#
# Batch 1 is the four whose sitemap entry ALREADY uses the clean form, so adding the redirect
# cannot put a redirecting URL into sitemap-static.mjs. /ev-calculator.html and
# /mtg-strixhaven.html are both submitted in their .html form and are held for batch 2, where
# the sitemap entry and (for strixhaven) the canonical tag have to move in the same change.
# /legal and /pricing are excluded by this task's permissions and were not touched.
[[redirects]]
  from = "/calendar.html"
  to = "/calendar"
  status = 301
  force = true

[[redirects]]
  from = "/cards.html"
  to = "/cards"
  status = 301
  force = true

[[redirects]]
  from = "/tools.html"
  to = "/tools"
  status = 301
  force = true

[[redirects]]
  from = "/shop.html"
  to = "/shop"
  status = 301
  force = true

# ── C3-076/077 BATCH 2 ──
# Batch 1 (above) was verified live before this batch was written: all four .html forms answer
# 301 to the clean form, the clean form still answers 200, and following the redirect resolves
# in ONE hop with no loop. This batch applies the identical, now-proven shape to the rest of the
# non-rewrite routes.
#
# /ev-calculator.html and /mtg-strixhaven.html are in this batch rather than batch 1 because
# sitemap-static.mjs submitted BOTH of them to Google in their .html form. Redirecting them
# without moving the sitemap entry would have put a URL that 301s into the sitemap, which is a
# worse state than the duplicate it fixes. Both entries are moved to the clean form in the same
# commit, and mtg-strixhaven's canonical tag, which was set to the .html form earlier tonight
# precisely because the sitemap said .html, moves with them.
[[redirects]]
  from = "/dnd.html"
  to = "/dnd"
  status = 301
  force = true

[[redirects]]
  from = "/generators.html"
  to = "/generators"
  status = 301
  force = true

[[redirects]]
  from = "/play.html"
  to = "/play"
  status = 301
  force = true

[[redirects]]
  from = "/quizzes.html"
  to = "/quizzes"
  status = 301
  force = true

[[redirects]]
  from = "/vip.html"
  to = "/vip"
  status = 301
  force = true

[[redirects]]
  from = "/content-engine.html"
  to = "/content-engine"
  status = 301
  force = true

[[redirects]]
  from = "/ev-calculator.html"
  to = "/ev-calculator"
  status = 301
  force = true

[[redirects]]
  from = "/mtg-strixhaven.html"
  to = "/mtg-strixhaven"
  status = 301
  force = true

# ── URL-01 BATCH 3, 31 August 2026 ──
#
# /legal.html and /pricing.html are the last two static routes serving 200 at BOTH forms. The
# batch-2 comment above names them and says why they were left: "excluded by this task's
# permissions and were not touched". This closes them with the identical, proven shape.
#
# force = true for the same reason as every rule above it: legal.html and pricing.html are real
# files that Eleventy publishes, and Netlify serves an existing file in preference to a redirect
# unless the rule is forced. Without it the rule silently does nothing.
#
# The coupled half matters more than the redirect. sitemap-static.mjs was submitting /legal.html
# AND /contact.html in their .html form. /contact.html has 301d since batch 2, so that sitemap has
# been advertising a redirecting URL ever since. Both entries were moved onto the clean form in
# this same commit, so no URL in the sitemap redirects.
#
# /pricing is also noindexed by TRIM-01 in this commit and has been dropped from the sitemap
# entirely, so its rule cannot introduce a redirecting sitemap entry either.
[[redirects]]
  from = "/legal.html"
  to = "/legal"
  status = 301
  force = true

[[redirects]]
  from = "/pricing.html"
  to = "/pricing"
  status = 301
  force = true

# /index.html duplicates the homepage. Note this one is NOT symmetrical with the others:
# /index already 301s to / on its own, so only the .html form needed a rule.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ── C3-076/077 SECTION 2: the four rewrite cases, ON A TEST BRANCH ──
#
# /tracker, /contact, /methodology and /welcome each have an explicit `status = 200` rewrite
# ABOVE this block, pointing the clean form at the .html file. That is what makes them different
# from every route in batches 1 and 2, where the clean form is resolved by Netlify's implicit
# pretty-URL file serving and never touches the redirect table at all.
#
# The risk being tested: if a 200 rewrite RE-ENTERS the redirect table, then
#   /welcome -> (rewrite) /welcome.html -> (this rule) 301 /welcome -> ...
# is an infinite loop, and /welcome is the QR destination printed on physical parcel inserts.
# Reasoning says Netlify resolves a rewrite to a file without re-processing rules, so the real
# sequence is one 301 then one 200. Reasoning is not verification, and the cost of being wrong
# here is a dead URL on printed material that cannot be recalled, so this is deployed to a branch
# preview and fetched there before it is allowed anywhere near production.
[[redirects]]
  from = "/tracker.html"
  to = "/tracker"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/methodology.html"
  to = "/methodology"
  status = 301
  force = true

[[redirects]]
  from = "/welcome.html"
  to = "/welcome"
  status = 301
  force = true

# task1 / C3L-210: /about.html 301s to the clean /about, matching the batch-1 treatment every
# other static page already has. force = true is required for the same reason recorded above:
# about.html is a real file Eleventy publishes, and Netlify serves an existing file in
# preference to an unforced redirect, so without it the duplicate keeps answering 200.
# No loop: nothing redirects /about to /about.html. Netlify resolves /about to the file by its
# own pretty-URL handling, which is file serving and not a redirect, so it never re-enters
# this table. That is the same reasoning as /calendar.
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

